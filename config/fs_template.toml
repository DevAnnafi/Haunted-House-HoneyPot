#!/bin/bash
# Nightly backup of the storefront database. Run from cron (/etc/cron.d/backup).
set -euo pipefail

DB_HOST="db01.internal.example"
DB_USER="backup_svc"
DB_PASS="Bkp-Svc-7730-Zq"
DB_NAME="storefront"
OUT="/var/backups/db/app_$(date +%F).sql"

PGPASSWORD="$DB_PASS" pg_dump -h "$DB_HOST" -U "$DB_USER" "$DB_NAME" > "$OUT"
chmod 600 "$OUT"
find /var/backups/db -name 'app_*.sql' -mtime +14 -delete
echo "$(date -Is) backup ok: $OUT"
'''

