# Fake filesystem template (T2.3, R2.2). Level-0 "normal" system: no haunting content.
#
# Loaded by VirtualFS.from_template(). One [[node]] table per filesystem entry.
#   path    absolute path inside the fake system (never a host path)
#   type    "file" or "dir"
#   mode    octal permissions as a string, e.g. "0644" ("1777" for sticky /tmp)
#   owner   owning user name
#   group   owning group name
#   mtime   UTC timestamp, quoted string, RFC 3339 (e.g. "2026-09-14T08:12:00Z")
#   content files only; text, written as a TOML literal string (''' ... ''')
#   size    optional, files only; byte size to DISPLAY (ls -l, stat, du) when the real content is a
#           short placeholder (e.g. a binary). When absent, display len(content in UTF-8 bytes).
#           Display only: content stays what cat reads, and size is not counted toward R2.9 limits.
#
# Rules: a parent directory must appear before its children. The template must stay well
# under 1,000 nodes so attackers keep room within the R2.9 entry limit.
# All credentials, hashes, and keys below are FAKE. Hostnames use the reserved ".example"
# TLD, IPs are RFC 5737 documentation ranges or RFC 1918 private ranges.
# System: Ubuntu 24.04.1 LTS, host "web-prod-01", matching OpenSSH_9.6p1 Ubuntu-3ubuntu13.5.
# Known simplifications: no symlinks (/bin is a real dir), /dev is empty (see design.md Open
# Questions), binaries under /bin, /usr/bin and /boot are tiny placeholders with a display size.

