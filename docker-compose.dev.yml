# Local development override. NEVER use this on the production server.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres
#
# Publishes PostgreSQL on the developer's own loopback address so host-side tools
# (psql, pytest tests/test_migration.py) can reach it. docker-compose.yml itself is
# unchanged and publishes no database port (ADR-0004); see docs/dev-database.md.
services:
  postgres:
    ports:
      # The host address is spelled out on purpose. Without "127.0.0.1:" Docker would
      # publish on 0.0.0.0 and expose the database to the whole network.
      # The host port defaults to 15432, not 5432: on Windows, Hyper-V can reserve 5432
      # in its excluded port ranges (see "netsh interface ipv4 show excludedportrange
      # protocol=tcp"), and a local PostgreSQL may already listen there. To use another
      # port, set DEV_POSTGRES_PORT (for example in .env); the address stays loopback.
      - "127.0.0.1:${DEV_POSTGRES_PORT:-15432}:5432"
    networks:
      # Merged with db_net from docker-compose.yml. db_net is "internal: true", and
      # Docker does not forward published ports for a container that is only on an
      # internal network, so the published port needs a second, non-internal network.
      - dev_net

networks:
  dev_net:
    driver: bridge
