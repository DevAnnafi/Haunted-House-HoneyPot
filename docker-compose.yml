# Honeypot + PostgreSQL (T9.1; ADR-0003, ADR-0004).
# The dashboard API service is added in a later task.
#
# Secrets are never written here:
#   .env          honeypot settings and secrets       (see .env.example)
#   postgres.env  PostgreSQL superuser password only  (see postgres.env.example)
# They are separate files so the honeypot container never receives the database
# superuser password (ADR-0003: each service gets only its own secrets).

name: haunted-house-honeypot

services:
  honeypot:
    build:
      context: .
      dockerfile: Dockerfile
    image: haunted-house-honeypot:local
    env_file: .env
    environment:
      # Fixed container-side values; these override anything in .env.
      # Bind all interfaces inside the container so the published port works. The
      # host-side exposure is controlled by "ports:" below, not by this address.
      HONEYPOT_SSH_HOST: "0.0.0.0"
      HONEYPOT_SSH_PORT: "2222"
      HONEYPOT_HOST_KEY_PATH: /run/secrets/ssh_host_key
    volumes:
      # Host key lives outside the repo; HONEYPOT_HOST_KEY_FILE is the host path
      # (set in .env, used here only for compose interpolation). Read-only.
      - type: bind
        source: ${HONEYPOT_HOST_KEY_FILE:?set HONEYPOT_HOST_KEY_FILE in .env to the host key path outside the repo}
        target: /run/secrets/ssh_host_key
        read_only: true
        bind:
          create_host_path: false
    ports:
      # WARNING: host port 22 is the server's own admin SSH port. Move the host's
      # sshd to another port (and allow that port in the firewall) BEFORE this goes
      # live, or you will lock yourself out or fail to bind. For local testing
      # use e.g. "2222:2222" instead.
      - "22:2222"
    networks:
      - honeypot_net # published SSH port; egress is blocked by the host firewall (below)
      - db_net # internal only: reaches PostgreSQL
    # Egress control (T9.6). The honeypot may reach only PostgreSQL, over db_net. It needs
    # honeypot_net (a non-internal network) only for the published SSH port, and Docker
    # cannot filter outbound traffic per network from inside Compose. So on the Linux
    # host, scripts/egress-firewall.sh adds DOCKER-USER (and INPUT) rules that drop
    # every new connection that starts in honeypot_net's fixed subnet below, and allow
    # replies to inbound SSH. Run it on every deployment host (docs/deployment.md). Until it
    # has run, this container has unrestricted outbound access.
    dns:
      # DNS never passes through those firewall rules: Docker's embedded resolver
      # (127.0.0.11) forwards outside lookups on the container's behalf. Pointing it
      # at an unroutable TEST-NET-1 address makes every outside lookup fail, while
      # container names such as "postgres" still resolve. Replace this with the LLM
      # egress proxy when it exists (design.md, Deployment).
      - 192.0.2.1
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 512m

  postgres:
    image: postgres:16
    env_file: postgres.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: honeypot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No "ports:" on purpose. PostgreSQL is reachable only on db_net (ADR-0004).
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d honeypot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  honeypot_net:
    driver: bridge
    driver_opts:
      # Fixed so the IPv6 firewall rule (scripts/egress-firewall.sh) can match the bridge
      # interface before Docker has created the network. Keep in sync with
      # HONEYPOT_BRIDGE_IFACE in that script. At most 15 characters.
      com.docker.network.bridge.name: honeypot0
    ipam:
      config:
        # Fixed so the host firewall can match it. Keep in sync with HONEYPOT_NET_SUBNET
        # in scripts/egress-firewall.sh. If this range clashes with a network on your
        # host, pick another unused private range and change both.
        - subnet: 172.30.250.0/24
  db_net:
    driver: bridge
    internal: true # no route to the host or the internet

volumes:
  postgres_data:
