[project]
name = "haunted-house-honeypot"
version = "0.1.0"
requires-python = ">=3.12"

# ── Ruff ─────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "spikes/",          # throwaway experiments, not production code
    ".venv/",
    "dashboard/",       # TypeScript/Next.js — not linted by ruff
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations (type hints)
    "RUF", # ruff-specific
]
ignore = [
    "S101",   # assert used in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]  # relax annotations and bandit in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
